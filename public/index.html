
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Question Answer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>✨ AI Question Answer</h1>
        <p class="subtitle">Ask anything and learn with AI!</p>

        <form id="questionForm">
            <textarea
                id="question"
                placeholder="Type your question here..."
                required
            ></textarea>

            <button type="submit" id="askBtn">Generate Answer</button>
        </form>

        <p id="message" role="status"></p>

        <div class="fact-box">
            <h3>AI Answer</h3>
            <p id="answer">Your answer will appear here.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
